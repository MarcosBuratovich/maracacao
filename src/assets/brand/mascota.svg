<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Mono de Maracacao">
  <style>
    /* Trazo de marcador: parejo, terminales redondeados. Ver §9.1 del spec.
       Las clases definen SOLO trazo: no declaran `fill`. El relleno va como
       atributo plano `fill="..."` en cada forma, y los trazos abiertos llevan
       `fill="none"` explícito. Así el color no depende de la cascada CSS y
       sobrevive a la importación a Rive. No volver a poner `fill: none` acá. */
    .t-principal { stroke: #372915; stroke-width: 11;
                   stroke-linecap: round; stroke-linejoin: round; }
    .t-interior  { stroke: #372915; stroke-width: 8;
                   stroke-linecap: round; stroke-linejoin: round; }
    .t-fino      { stroke: #372915; stroke-width: 5;
                   stroke-linecap: round; stroke-linejoin: round; }
    /* La capa de pivotes se borra después de riggear. */
    #pivotes { display: none; }
  </style>

  <g id="escena">
    <g id="suelo"></g>
    <g id="granos-orbita"></g>
    <g id="mono">
      <g id="cola"></g>
      <g id="pierna-post"><g id="pie-post"></g></g>
      <g id="brazo-post"></g>
      <g id="cuerpo"></g>
      <g id="pierna-apoyo"><g id="pie-apoyo"></g></g>
      <g id="brazo-l"><g id="mano-l"></g></g>
      <g id="bowl">
        <g id="bowl-cuenco"></g>
        <g id="bowl-contenido"></g>
        <g id="bowl-borde"></g>
      </g>
      <g id="brazo-r"><g id="mano-r"></g></g>
      <!-- Cabeza. Eje en x=512; corona en y=64, mentón en y=258 (alto 194),
           oreja a oreja 350.33 (x 336.83–687.17). Los números salen del
           presupuesto vertical fijado en la review: corona y=64, planta de
           pies y=956, figura completa 4.6 cabezas → 892/4.6 ≈ 194 de alto.
           La geometría está horneada a esa escala: el archivo no lleva
           ningún atributo de transformación y no hay que agregarle uno.
           El relleno va como atributo plano `fill`, y las clases `.t-*` no
           declaran `fill` (ver el <style>). -->
      <g id="cabeza">
        <!-- Orejas: discos COMPLETOS, por detrás del cráneo. No recortar la
             mitad tapada: al rotarlas en Rive tiene que seguir habiendo disco. -->
        <g id="oreja-l">
          <circle id="oreja-l-disco" class="t-principal" fill="#5B744B"
                  cx="381.1" cy="122.39" r="44.26"/>
          <ellipse id="oreja-l-interior" class="t-interior" fill="#F8B465"
                   cx="393.34" cy="122.39" rx="23.54" ry="22.6"/>
        </g>
        <g id="oreja-r">
          <circle id="oreja-r-disco" class="t-principal" fill="#5B744B"
                  cx="642.9" cy="122.39" r="44.26"/>
          <ellipse id="oreja-r-interior" class="t-interior" fill="#F8B465"
                   cx="630.66" cy="122.39" rx="23.54" ry="22.6"/>
        </g>

        <!-- Cráneo COMPLETO, por detrás del rostro. Tapa la mitad interna de
             cada oreja y produce la muesca cóncava de la unión. -->
        <g id="craneo">
          <path id="craneo-forma" class="t-principal" fill="#5B744B"
                d="M 512 64 C 581.69 64 629.72 111.09 629.72 175.13
                   C 629.72 227.86 583.57 258 512 258
                   C 440.43 258 394.28 227.86 394.28 175.13
                   C 394.28 111.09 442.31 64 512 64 Z"/>
        </g>

        <!-- Rostro COMPLETO, por delante del cráneo. Borde superior en
             corazón: dos lóbulos de ceja anchos con muesca en V sobre el eje. -->
        <g id="rostro">
          <path id="rostro-forma" class="t-principal" fill="#F8B465"
                d="M 512 118.62 C 498.82 101.67 478.1 95.08 458.32 101.67
                   C 438.54 108.26 421.59 131.81 418.77 161.94
                   C 415.94 195.84 429.13 233.51 453.61 245.76
                   C 471.5 254.23 491.28 254.23 512 254.23
                   C 532.72 254.23 552.5 254.23 570.39 245.76
                   C 594.87 233.51 608.06 195.84 605.23 161.94
                   C 602.41 131.81 585.46 108.26 565.68 101.67
                   C 545.9 95.08 525.18 101.67 512 118.62 Z"/>
        </g>

        <!-- Ojos cerrados de sonrisa: arcos abiertos. El `fill="none"` es
             obligatorio y explícito: las clases `.t-*` ya no lo declaran. -->
        <g id="ojo-l">
          <path id="ojo-l-arco" class="t-interior" fill="none"
                d="M 447.02 162.88 C 454.55 143.11 482.81 143.11 490.34 162.88"/>
        </g>
        <g id="ojo-r">
          <path id="ojo-r-arco" class="t-interior" fill="none"
                d="M 533.66 162.88 C 541.19 143.11 569.45 143.11 576.98 162.88"/>
        </g>

        <!-- Cachetes: mancha plana sin trazo, rosa-300 sólido. Antes eran
             bordó al 35 %, que sobre el rostro tan daba un tostado y no un
             rubor; con la rampa rosa en la paleta el color va directo y sin
             opacidad (una opacidad es un color que no se puede tokenizar). -->
        <g id="cachete-l">
          <ellipse id="cachete-l-mancha" fill="#E0A9A4"
                   cx="440.43" cy="189.25" rx="19.78" ry="12.24"/>
        </g>
        <g id="cachete-r">
          <ellipse id="cachete-r-mancha" fill="#E0A9A4"
                   cx="583.57" cy="189.25" rx="19.78" ry="12.24"/>
        </g>

        <g id="nariz">
          <path id="nariz-forma" fill="#372915"
                d="M 495.05 160.06 C 495.05 152.52 528.95 152.52 528.95 160.06
                   C 528.95 169.48 518.59 173.24 512 173.24
                   C 505.41 173.24 495.05 169.48 495.05 160.06 Z"/>
        </g>

        <!-- Boca abierta de risa. Cuerpo en medialuna: comisura izquierda baja
             y en punta, labio superior en alza hacia la derecha. El gancho de
             la comisura derecha va como trazo abierto aparte: en la referencia
             es un remate de pincel que se afina, y con trazo parejo no se
             puede cerrar sin que se empaste. -->
        <g id="boca">
          <path id="boca-forma" class="t-interior" fill="#8B4D3F"
                d="M 450.79 193.02 C 472.45 192.08 502.58 189.25 528.95 183.6
                   C 538.37 185.49 542.14 193.02 538.37 201.5
                   C 530.83 218.45 513.88 233.51 491.28 233.51
                   C 472.45 233.51 456.44 215.62 450.79 193.02 Z"/>
          <path id="boca-comisura" class="t-interior" fill="none"
                d="M 527.07 182.66 C 534.6 175.13 544.96 172.3 550.61 179.83
                   C 556.26 187.37 557.2 192.08 557.2 198.67"/>
          <!-- Lengua en rosa-300, no rosa-400: contra el bordó de la boca
               (#8B4D3F) rosa-300 da 3.21 de contraste y rosa-400 sólo 2.36.
               A tamaño chico rosa-400 se empasta con la boca y la lengua
               pierde forma; rosa-300 conserva la silueta. Era crema y a
               tamaño chico se leía como un diente. -->
          <path id="lengua" class="t-fino" fill="#E0A9A4"
                d="M 487.51 220.33 C 492.22 210.91 511.06 204.32 523.3 209.97
                   C 529.89 213.74 527.07 225.98 514.83 229.75
                   C 502.58 233.51 489.4 227.86 487.51 220.33 Z"/>
        </g>
      </g>
      <g id="chispas"></g>
    </g>
  </g>

  <!-- Marcadores de pivote. Alinear el origen de cada objeto en Rive contra
       su marcador y después borrar esta capa entera. Ver §9.3 del spec.
       Las coordenadas se ajustan al dibujar cada parte (tareas 6-9). -->
  <g id="pivotes">
    <circle id="piv-cola"          cx="0" cy="0" r="4" fill="#8B4D3F"/>
    <circle id="piv-pierna-post"   cx="0" cy="0" r="4" fill="#8B4D3F"/>
    <circle id="piv-pie-post"      cx="0" cy="0" r="4" fill="#8B4D3F"/>
    <circle id="piv-brazo-post"    cx="0" cy="0" r="4" fill="#8B4D3F"/>
    <circle id="piv-pierna-apoyo"  cx="0" cy="0" r="4" fill="#8B4D3F"/>
    <circle id="piv-pie-apoyo"     cx="0" cy="0" r="4" fill="#8B4D3F"/>
    <circle id="piv-brazo-l"       cx="0" cy="0" r="4" fill="#8B4D3F"/>
    <circle id="piv-mano-l"        cx="0" cy="0" r="4" fill="#8B4D3F"/>
    <circle id="piv-brazo-r"       cx="0" cy="0" r="4" fill="#8B4D3F"/>
    <circle id="piv-mano-r"        cx="0" cy="0" r="4" fill="#8B4D3F"/>
    <!-- Cabeza: base del cuello, por debajo del mentón (y=258). -->
    <circle id="piv-cabeza"        cx="512" cy="287.19" r="4" fill="#8B4D3F"/>
    <!-- Orejas: unión con el cráneo = punto del borde del cráneo más cercano
         al centro del disco de la oreja. -->
    <circle id="piv-oreja-l"       cx="400.87" cy="132.75" r="4" fill="#8B4D3F"/>
    <circle id="piv-oreja-r"       cx="623.13" cy="132.75" r="4" fill="#8B4D3F"/>
    <!-- Ojos: centro del arco. -->
    <circle id="piv-ojo-l"         cx="468.68" cy="155.35" r="4" fill="#8B4D3F"/>
    <circle id="piv-ojo-r"         cx="555.32" cy="155.35" r="4" fill="#8B4D3F"/>
  </g>
</svg>
