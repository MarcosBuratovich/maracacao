             C 204.16 375.33 229.48 375.33 256 375.33
             C 282.52 375.33 307.84 375.33 330.74 364.49
             C 362.07 348.81 378.96 300.6 375.33 257.2
             C 371.72 218.64 350.03 188.49 324.71 180.06
             C 299.39 171.62 272.87 180.06 256 201.75 Z"/>
  </g>

  <!-- Ojos cerrados de sonrisa: arcos abiertos, igual criterio que
       mascota.svg. `fill="none"` obligatorio y explícito: la clase
       `.t-ojos` no lo declara. Trazo más grueso que el contorno a
       propósito: es la única forma sin relleno detrás, y a 32 px un
       arco fino desaparece. -->
  <g id="ojo-l">
    <path class="t-ojos" stroke="#372915" fill="none"
          d="M 172.83 258.41 C 182.46 233.1 218.64 233.1 228.28 258.41"/>
  </g>
  <g id="ojo-r">
    <path class="t-ojos" stroke="#372915" fill="none"
          d="M 283.72 258.41 C 293.36 233.1 329.54 233.1 339.17 258.41"/>
  </g>

  <g id="nariz">
