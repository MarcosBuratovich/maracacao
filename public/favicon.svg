<!-- GENERADO por pnpm favicon. No editar a mano. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <circle cx="256" cy="256" r="256" fill="#4B5F3E"/>

  <style>
    /* Mismo criterio de mascota.svg (§9.1 del spec): la clase define SOLO
       trazo (ancho, remate, unión) y nunca fill. A diferencia de
       mascota.svg, acá el COLOR del trazo tampoco vive en la clase: va
       como atributo plano `stroke="#372915"` en cada forma, igual que el
       relleno va como atributo plano `fill`. Esto es necesario para que
       `atributosDeTrazo` (test/svg-utils.ts) encuentre las formas — el
       helper resuelve `stroke-width`/`stroke-linecap` tanto de atributo
       como de clase, pero selecciona por `[stroke]` como atributo del
       elemento, no por la cascada CSS. Trazo proporcionalmente más grueso
       que en la cabeza completa (11/1024 ≈ 0.0107): acá 18/512 ≈ 0.0352
       para el contorno y 24/512 ≈ 0.0469 para los ojos, que al ser trazo
       abierto sin relleno son la única forma que sostiene el detalle. */
    .t-contorno { stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
    .t-ojos     { stroke-width: 24; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Punto de partida: la cabeza de mascota.svg (Task 9), geometría
       verificada por dos revisiones. Mismo bbox (eje x=512, corona
       y=64, mentón y=258 en el viewBox 1024) reescalado x1.28 y
       centrado en el canvas 512, sin `transform`: las coordenadas ya
       vienen horneadas a la escala nueva.
       Se quitó todo lo que no sobrevive a 32 px: cachetes, lengua,
       detalle interno de oreja (la elipse tan) y el gancho de comisura
       de la boca. Quedan 8 formas: cráneo, rostro, dos orejas, dos
       ojos, nariz, boca — bien debajo del máximo de 12. -->

  <g id="oreja-l">
    <circle class="t-contorno" stroke="#372915" fill="#5B744B"
            cx="88.45" cy="206.58" r="56.65"/>
  </g>
  <g id="oreja-r">
    <circle class="t-contorno" stroke="#372915" fill="#5B744B"
            cx="423.55" cy="206.58" r="56.65"/>
  </g>

  <g id="craneo">
    <path class="t-contorno" stroke="#372915" fill="#5B744B"
          d="M 256 131.84 C 345.2 131.84 406.68 192.12 406.68 274.09
             C 406.68 341.58 347.61 380.16 256 380.16
             C 164.39 380.16 105.32 341.58 105.32 274.09
             C 105.32 192.12 166.8 131.84 256 131.84 Z"/>
