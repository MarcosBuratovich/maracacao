<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    /* color viejo, no debe contar: #FF0000 */
    #cafe00 { display: none; }
    .marca { fill: #123abc; }
  </style>
  <!-- color viejo, no debe contar: #DEAD00 -->
  <rect fill="#abc" x="0" y="0" width="1" height="1"/>
  <rect fill="#11223344" x="0" y="0" width="1" height="1"/>
  <rect fill="#ABCD" x="0" y="0" width="1" height="1"/>
  <rect style="fill:#f8b465" x="0" y="0" width="1" height="1"/>
  <rect class="marca" x="0" y="0" width="1" height="1"/>
  <linearGradient id="degradado">
    <stop offset="0" stop-color="#5b744b"/>
  </linearGradient>
</svg>
